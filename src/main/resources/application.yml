server:
  port: 18443
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

spring:
  datasource:
    url: jdbc:h2:file:./data/llama-hub.mv.db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: -1

gateway:
  upstream: http://192.168.2.185:18082
  model:
    ssh-host: 192.168.2.185
    ssh-port: 22
    ssh-user: root
    ssh-timeout-seconds: 15
    api-port: 18082
    base-dir: /home/llama-cpp
    server-binary: /home/llama-cpp/llama.cpp/build-cuda/bin/llama-server
    model-path: /home/hf/ukisai/Swift-Qwen3.8-27B-GGUF/Swift-Qwen3.8-27B-Q4_K_M.gguf
    mmproj-path: /home/hf/ukisai/Swift-Qwen3.8-27B-GGUF/mmproj-Swift-Qwen3.8-27B-F16.gguf
    probe-interval-ms: 5000
    start-timeout-seconds: 300
    stop-timeout-seconds: 180
    log-tail-lines: 500
  key:
    # 密钥明文副本的 AES 加密密钥；强烈建议通过环境变量 GATEWAY_KEY_ENCRYPTION_KEY 覆盖；
    # 留空时启动自动生成随机密钥并持久化到 ./data/enc.key（代码中无默认值）
    encryption-key: ${GATEWAY_KEY_ENCRYPTION_KEY:}
  log:
    retention-days: 90
    body-enabled: false
  admin:
    allowed-ips: ""

logging:
  file:
    name: logs/llama-hub.log
  level:
    com.llama.hub: INFO
